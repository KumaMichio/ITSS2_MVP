services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobmatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/jobmatch
      JWT_SECRET: change-this-in-production
      PORT: 3001
      FRONTEND_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3001/api
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
