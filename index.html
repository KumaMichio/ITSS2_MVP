<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobMatch JP — Tìm việc IT tại Nhật</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-flag">🇯🇵</span>
        <span class="logo-text">JobMatch <strong>JP</strong></span>
      </div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input id="searchInput" type="text" placeholder="Tìm kiếm job, công ty, kỹ năng..." />
      </div>
      <a class="user-badge user-badge-link" href="profile.html" title="Xem & chỉnh sửa hồ sơ">
        <div class="avatar" id="hdrBadgeAvatar">A</div>
        <div class="user-info">
          <span class="user-name" id="hdrBadgeName">Nguyen Van A</span>
          <span class="user-sub"  id="hdrBadgeSub">Java Dev · N3 · Tokyo</span>
        </div>
        <span class="badge-edit-hint">✏️</span>
      </a>
    </div>
  </header>

  <div class="layout" id="layout">

    <aside class="sidebar">
      <div class="sidebar-top">
        <span class="sidebar-title">Bộ lọc</span>
        <button id="resetBtn" class="reset-btn">Xóa tất cả</button>
      </div>

      <div class="filter-group">
        <div class="filter-label">Kỹ năng</div>
        <div class="skill-tags" id="skillTags"></div>
      </div>

      <div class="filter-group">
        <div class="filter-label">Tiếng Nhật</div>
        <div class="radio-list" id="jpRadio">
          <label><input type="radio" name="jp" value="" checked /> Tất cả</label>
          <label><input type="radio" name="jp" value="N1" /> N1 (Cao nhất)</label>
          <label><input type="radio" name="jp" value="N2" /> N2</label>
          <label><input type="radio" name="jp" value="N3" /> N3</label>
          <label><input type="radio" name="jp" value="N4" /> N4</label>
          <label><input type="radio" name="jp" value="N5" /> N5 (Cơ bản)</label>
        </div>
      </div>

      <div class="filter-group">
        <div class="filter-label">Địa điểm</div>
        <div class="radio-list" id="locationRadio">
          <label><input type="radio" name="loc" value="" checked /> Tất cả</label>
          <label><input type="radio" name="loc" value="Tokyo" /> Tokyo</label>
          <label><input type="radio" name="loc" value="Osaka" /> Osaka</label>
          <label><input type="radio" name="loc" value="Kyoto" /> Kyoto</label>
          <label><input type="radio" name="loc" value="Nagoya" /> Nagoya</label>
        </div>
      </div>

      <div class="filter-group">
        <div class="filter-label">Độ phù hợp</div>
        <div class="radio-list">
          <label><input type="radio" name="match" value="" checked /> Tất cả</label>
          <label><input type="radio" name="match" value="high" /> Cao (≥70%)</label>
          <label><input type="radio" name="match" value="mid" /> Trung bình (40–69%)</label>
          <label><input type="radio" name="match" value="low" /> Thấp (&lt;40%)</label>
        </div>
      </div>

      <div class="profile-card">
        <div class="profile-card-title">Hồ sơ của bạn</div>
        <div class="profile-skills" id="profileSkills"></div>
        <div class="profile-jp" id="profileJp"></div>
        <a href="profile.html" class="profile-edit-link">✏️ Chỉnh sửa hồ sơ</a>
      </div>
    </aside>

    <section class="job-section">
      <div class="list-header">
        <span id="jobCount" class="job-count"></span>
        <select id="sortSelect" class="sort-select">
          <option value="match">Sắp xếp: Độ phù hợp</option>
          <option value="trust">Sắp xếp: Trust Score</option>
          <option value="newest">Sắp xếp: Mới nhất</option>
          <option value="salary">Sắp xếp: Lương cao nhất</option>
        </select>
      </div>
      <div id="cardGrid" class="card-grid"></div>
    </section>

    <aside class="detail-panel" id="detailPanel">
      <div id="detailBody" class="detail-body"></div>
    </aside>

  </div>

  <script src="app.js"></script>
</body>
</html>
